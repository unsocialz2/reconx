<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ReconX · Reconnaissance workspace</title>
    <style>
      :root {
        --bg: #f4f6fa;
        --panel: #fff;
        --ink: #152334;
        --muted: #66778a;
        --line: #e0e6ed;
        --teal: #007f78;
        --soft: #e6f5f1;
        --amber: #95630c;
        --red: #ba3842;
        --nav: #101e2b;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.55 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a {
        cursor: pointer;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        background: var(--panel);
        color: var(--ink);
      }
      button:hover {
        border-color: var(--teal);
      }
      a {
        color: var(--teal);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #49b9ae;
        outline-offset: 2px;
      }
      .app {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100vh;
      }
      aside {
        background: var(--nav);
        color: #b7c6d5;
        padding: 29px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
      }
      .brand {
        font-size: 25px;
        letter-spacing: -1px;
        font-weight: 800;
        color: #fff;
        padding: 0 12px;
      }
      .brand em {
        font-style: normal;
        color: #4fdbc1;
      }
      .edition {
        padding: 2px 12px 28px;
        font-size: 11px;
        letter-spacing: 2px;
        color: #8aa1b6;
      }
      .nav-caption {
        font-size: 10px;
        letter-spacing: 1.6px;
        color: #8095a9;
        padding: 15px 12px 8px;
      }
      .nav {
        display: flex;
        align-items: center;
        width: 100%;
        border: 0;
        background: none;
        color: #b7c6d5;
        text-align: left;
        padding: 10px 12px;
        margin: 3px 0;
        border-radius: 9px;
        gap: 9px;
      }
      .nav.active {
        background: #213d46;
        color: #75e6ce;
      }
      .nav span {
        margin-left: auto;
        color: #8ba6b8;
        font:
          11px ui-monospace,
          monospace;
      }
      .aside-note {
        margin: 30px 12px 0;
        border-top: 1px solid #2b3c4d;
        padding-top: 18px;
        font-size: 11px;
        color: #8ca1b4;
      }
      .main {
        padding: 28px 34px 40px;
        min-width: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 30px;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
      }
      .target {
        font-size: 18px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .offline {
        font-size: 11px;
        color: var(--teal);
        background: var(--soft);
        padding: 5px 10px;
        border-radius: 20px;
        white-space: nowrap;
      }
      h1 {
        font-size: 31px;
        letter-spacing: -1px;
        margin: 0 0 5px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 15px;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
      }
      .intro {
        margin-bottom: 22px;
      }
      .banner {
        border: 1px solid #e9d7a7;
        background: #fff8e7;
        color: #725217;
        padding: 14px 18px;
        border-radius: 10px;
        margin: 0 0 24px;
        overflow-wrap: anywhere;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 23px;
      }
      .card,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 21px;
      }
      .card {
        cursor: pointer;
      }
      .card:hover {
        box-shadow: 0 5px 16px #1633440b;
        border-color: #72b8af;
      }
      .card .label {
        font-size: 12px;
        color: var(--muted);
      }
      .card .number {
        font-size: 31px;
        font-weight: 750;
        letter-spacing: -1px;
        margin: 7px 0 2px;
      }
      .card .note {
        font-size: 11px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 18px;
        margin-bottom: 18px;
      }
      .panel {
        min-width: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .pill {
        display: inline-block;
        font-size: 11px;
        line-height: 1.3;
        border-radius: 6px;
        background: var(--bg);
        color: var(--muted);
        padding: 5px 8px;
        white-space: nowrap;
      }
      .completed,
      .done,
      .positive {
        color: #126c5a;
        background: #e4f4ec;
      }
      .partial,
      .timeout,
      .unknown {
        color: #94620c;
        background: #fff2d6;
      }
      .error,
      .failed,
      .critical,
      .high {
        color: var(--red);
        background: #fce9eb;
      }
      .medium {
        color: #94620c;
        background: #fff2d6;
      }
      .bar {
        height: 6px;
        background: var(--bg);
        border-radius: 5px;
        overflow: hidden;
        margin: 5px 0 13px;
      }
      .bar i {
        height: 100%;
        display: block;
        background: #30a495;
        border-radius: 5px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .toolbar input {
        flex: 1;
        min-width: 200px;
      }
      .toolbar input,
      .toolbar select {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        padding: 10px 12px;
        color: var(--ink);
      }
      .table-panel {
        padding: 0;
        overflow: hidden;
      }
      .scroll {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th {
        background: var(--bg);
        text-align: left;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        white-space: nowrap;
        padding: 12px 17px;
        cursor: pointer;
      }
      td {
        padding: 13px 17px;
        border-top: 1px solid var(--line);
        max-width: 500px;
        overflow-wrap: anywhere;
        vertical-align: top;
      }
      tr:hover td {
        background: #6aab9b08;
      }
      .link-button {
        padding: 0;
        border: 0;
        color: var(--teal);
        background: none;
        text-align: left;
      }
      .mono {
        font:
          11px/1.5 ui-monospace,
          SFMono-Regular,
          monospace;
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 17px;
        gap: 10px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .empty {
        text-align: center;
        padding: 55px 20px;
        color: var(--muted);
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .coverage-item {
        border-left: 3px solid #dfb15b;
        padding: 12px 16px;
        background: var(--panel);
        border-radius: 0 8px 8px 0;
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
      .drawer {
        position: fixed;
        right: 0;
        top: 0;
        height: 100vh;
        width: min(720px, 95vw);
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -20px 0 80px #0d203322;
        z-index: 5;
        padding: 30px;
        overflow: auto;
      }
      .drawer header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 20px;
      }
      .drawer h2 {
        font-size: 22px;
        overflow-wrap: anywhere;
      }
      .drawer pre {
        font:
          12px/1.6 ui-monospace,
          monospace;
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 16px;
        border-radius: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .drawer img {
        max-width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
      }
      [hidden] {
        display: none !important;
      }
      .footer {
        margin-top: 27px;
        font-size: 11px;
        color: var(--muted);
      }
      .stat-inline {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 15px 0;
      }
      .stat-inline > div {
        background: var(--bg);
        padding: 12px;
        border-radius: 8px;
      }
      .stat-inline strong {
        display: block;
        font-size: 22px;
      }
      .chipset {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0 15px;
      }
      .dark {
        --bg: #101922;
        --panel: #16232f;
        --ink: #e4edf3;
        --muted: #a0b1bf;
        --line: #2c3c49;
        --teal: #6adac6;
        --soft: #1d3c37;
      }
      .dark .banner {
        background: #342c1d;
        border-color: #635431;
        color: #e9d59e;
      }
      .dark .completed,
      .dark .done,
      .dark .positive {
        background: #163b30;
        color: #82dfbc;
      }
      .dark .partial,
      .dark .timeout,
      .dark .unknown {
        background: #3c3017;
        color: #edcd83;
      }
      .dark .error,
      .dark .high,
      .dark .critical {
        background: #40242b;
        color: #ffa5ab;
      }
      .theme-label {
        font-size: 12px;
      }
      @media (max-width: 1000px) {
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .main {
          padding: 22px;
        }
        .app {
          grid-template-columns: 190px minmax(0, 1fr);
        }
      }
      @media (max-width: 680px) {
        .app {
          display: block;
        }
        aside {
          position: relative;
          height: auto;
          padding: 18px;
        }
        .edition,
        .nav-caption,
        .aside-note {
          display: none;
        }
        nav {
          display: flex;
          overflow: auto;
          margin-top: 14px;
        }
        .nav {
          width: auto;
          white-space: nowrap;
          flex: none;
        }
        .brand {
          font-size: 21px;
        }
        .main {
          padding: 20px 14px;
        }
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }
        .cards {
          gap: 9px;
        }
        .card {
          padding: 15px;
        }
        h1 {
          font-size: 26px;
        }
        .actions {
          flex-wrap: wrap;
        }
      }
      @media print {
        aside,
        .toolbar,
        .actions,
        .pager,
        .drawer,
        button {
          display: none !important;
        }
        .app {
          display: block;
        }
        .main {
          padding: 0;
        }
        .section {
          display: block !important;
          break-inside: avoid;
        }
        .cards {
          grid-template-columns: repeat(4, 1fr);
        }
        body {
          background: white;
          color: #111;
        }
        .panel,
        .card {
          box-shadow: none;
        }
        .scroll {
          overflow: visible;
        }
        .section:not(#overview) {
          margin-top: 30px;
        }
        .footer:after {
          content: " · Use the interactive HTML or CSV/JSON exports for the complete dataset.";
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          recon<em>x</em
          ><span
            style="font-size:11px;margin-left:7px;letter-spacing:0;color:#8ca1b4"
            >1.2</span
          >
        </div>
        <div class="edition">RECONNAISSANCE WORKSPACE</div>
        <div class="nav-caption">SCAN REFERENCE</div>
        <nav id="navigation"></nav>
        <div class="aside-note">
          Self-contained report<br />All data stays in this file.<br /><br />Matches
          need impact review.<br />Skipped does not mean clean.
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <div class="eyebrow">Reconnaissance / Scan report</div>
            <div class="target" id="targets"></div>
          </div>
          <div class="actions">
            <span class="offline">● Offline ready</span
            ><button id="theme" aria-label="Toggle color theme">
              Dark mode</button
            ><button id="export-all">Export JSON</button
            ><button id="print">Print</button>
          </div>
        </header>
        <div id="pages"></div>
        <footer class="footer" id="footer"></footer>
      </main>
    </div>
    <section
      class="drawer"
      id="drawer"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Result details"
    >
      <header>
        <h2 id="drawer-title"></h2>
        <button id="close-drawer" aria-label="Close details">Close ×</button>
      </header>
      <div id="drawer-content"></div>
    </section>
    <script id="scan-data" type="application/json">
      {{.JSON}}
    </script>
    <script>
      "use strict";
      const SCAN_DATA = JSON.parse(document.getElementById("scan-data").textContent),
        D = SCAN_DATA.data;
      const $ = (s) => document.querySelector(s),
        arr = (x) => (Array.isArray(x) ? x : []),
        fmt = (x) => Number(x || 0).toLocaleString(),
        hostOf = (raw) => {
          try {
            return new URL(
              raw.includes("://") ? raw : "https://" + raw,
            ).hostname.toLowerCase();
          } catch {
            return "";
          }
        },
        hostURL = (h) => h.meta?.url || "https://" + h.domain;
      const node = (tag, text, cls) => {
        const el = document.createElement(tag);
        if (text !== undefined) el.textContent = String(text);
        if (cls) el.className = cls;
        return el;
      };
      const pill = (text, cls = text) =>
        node(
          "span",
          text,
          "pill " +
            String(cls)
              .toLowerCase()
              .replace(/[^a-z-]/g, ""),
        );
      const safeLink = (raw) => {
        try {
          const u = new URL(raw);
          if (!["http:", "https:"].includes(u.protocol)) return node("span", raw);
          const a = node("a", raw);
          a.href = u.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          return a;
        } catch {
          return node("span", raw);
        }
      };
      // Derive complete query mappings once. Reuse URL string references instead
      // of serializing every URL twice into the HTML document.
      const allParameters = arr(SCAN_DATA.parameters).slice();
      const queryNamesByURL = new Map();
      for (const p of allParameters) {
        if (p.source === "URL query") {
          if (!queryNamesByURL.has(p.url)) queryNamesByURL.set(p.url, new Set());
          queryNamesByURL.get(p.url).add(p.name);
        }
      }
      for (const raw of arr(D.urls)) {
        try {
          const u = new URL(raw);
          if (!u.search) continue;
          const names = new Set(u.searchParams.keys());
          for (const name of names) {
            if (!queryNamesByURL.get(raw)?.has(name))
              allParameters.push({
                name,
                url: raw,
                method: "GET",
                source: "URL query",
              });
          }
        } catch {}
      }
      SCAN_DATA.parameters = allParameters;
      const assets = new Map();
      function asset(h) {
        if (!h) return null;
        if (!assets.has(h))
          assets.set(h, {
            host: h,
            sources: [],
            endpoints: [],
            urls: 0,
            js: 0,
            parameters: 0,
            findings: 0,
            secrets: 0,
            technologies: [],
            waf: "unknown",
          });
        return assets.get(h);
      }
      arr(D.subdomain_sources).forEach((s) => {
        const a = asset(s.subdomain);
        if (a && !a.sources.includes(s.source || "unknown"))
          a.sources.push(s.source || "unknown");
      });
      arr(D.hosts).forEach((h) => {
        const a = asset(h.domain);
        if (a) {
          a.endpoints.push(h);
          a.technologies = [...new Set([...a.technologies, ...arr(h.tech_stack)])];
        }
      });
      arr(D.urls).forEach((u) => {
        const a = asset(hostOf(u));
        if (a) a.urls++;
      });
      arr(D.js_files).forEach((u) => {
        const a = asset(hostOf(u));
        if (a) a.js++;
      });
      arr(SCAN_DATA.parameters).forEach((p) => {
        const a = asset(hostOf(p.url));
        if (a) a.parameters++;
      });
      arr(D.findings).forEach((f) => {
        const a = asset(hostOf(f.target));
        if (a) a.findings++;
      });
      arr(D.secrets).forEach((s) => {
        const a = asset(hostOf(s.file || ""));
        if (a) a.secrets++;
      });
      arr(D.waf_results).forEach((w) => {
        const a = asset(hostOf(w.host));
        if (a) {
          if (w.detected) a.waf = "detected";
          else if (a.waf !== "detected") a.waf = "not detected";
        }
      });
      const wafByEndpoint = new Map();
      for (const w of arr(D.waf_results)) {
        try {
          const key = new URL(w.host).origin;
          wafByEndpoint.set(key, w.detected || wafByEndpoint.get(key) || false);
        } catch {}
      }
      for (const a of assets.values()) {
        if (a.waf !== "detected")
          a.waf =
            a.endpoints.length &&
            a.endpoints.every((h) => {
              try {
                return wafByEndpoint.get(new URL(hostURL(h)).origin) === false;
              } catch {
                return false;
              }
            })
              ? "not detected"
              : "unknown";
      }
      const params = arr(SCAN_DATA.parameters),
        phaseRows = Object.entries(SCAN_DATA.phases || {}).map(([name, p]) => ({
          name,
          ...p,
        }));
      const phaseStatus = (name) =>
        SCAN_DATA.phases?.[name]?.status || "not recorded";
      const comparisonRows = [];
      for (const [collection, change] of Object.entries(
        SCAN_DATA.comparison?.changes || {},
      )) {
        for (const state of ["added", "unobserved"])
          for (const item of arr(change[state]))
            comparisonRows.push({ collection, state, item });
      }
      const tables = {
        comparison: {
          title: "Scan comparison",
          note:
            SCAN_DATA.comparison?.note ||
            "Rebuild with --report-only CURRENT --compare-with PREVIOUS to compare stored observations without scanning.",
          rows: comparisonRows,
          cols: [
            ["Collection", "collection"],
            ["Observation", "state"],
            ["Asset / result", "item"],
          ],
          filter: "state",
        },
        assets: {
          title: "Asset inventory",
          note: "One profile per hostname. Open an asset to connect its endpoints, technologies and results.",
          rows: [...assets.values()],
          cols: [
            ["Host", "host"],
            ["HTTP endpoints", (r) => r.endpoints.length],
            ["URLs", "urls"],
            ["JavaScript", "js"],
            ["Parameters", "parameters"],
            ["WAF", "waf"],
            ["Technologies", (r) => r.technologies.join(", ")],
            ["Discovery source", (r) => r.sources.join(", ")],
          ],
          detail: "asset",
        },
        subdomains: {
          title: "Subdomain discovery",
          note: "Complete discovered hostname list with first-source attribution.",
          rows: arr(D.subdomain_sources).map((s) => ({
            host: s.subdomain,
            source: s.source,
          })),
          cols: [
            ["Host", "host"],
            ["Source", "source"],
          ],
          filter: "source",
          detail: "asset",
        },
        ports: {
          title: "Optional port scan",
          note:
            "Port scanning is opt-in. Phase state: " +
            phaseStatus("ports") +
            ". No records does not establish that ports are closed.",
          rows: arr(D.ports),
          cols: [
            ["Host", "host"],
            ["Port", "port"],
            ["Protocol", "protocol"],
            ["Service", "service"],
            ["Banner", "banner"],
          ],
          detail: "record",
        },
        networks: {
          title: "IP ranges",
          note: "Recorded network ranges. Discovery is separate from authorization for active testing.",
          rows: arr(D.ip_ranges).map((range) => ({ range })),
          cols: [["Range", "range"]],
        },
        screenshots: {
          title: "Screenshots",
          note: "Captured images require the screenshots directory to remain beside this report.",
          rows: Object.entries(SCAN_DATA.screenshots || {}).map(([host, image]) => ({
            host,
            image,
          })),
          cols: [
            ["Host", "host"],
            ["Image", "image"],
          ],
          detail: "record",
        },
        artifacts: {
          title: "Evidence files",
          note: "Private raw evidence. Links require the original output directory. Files may contain credentials: redact before sharing.",
          rows: arr(SCAN_DATA.artifacts),
          cols: [
            ["File", "name"],
            ["Classification", () => "private evidence"],
          ],
        },
        hosts: {
          title: "Live HTTP endpoints",
          note: "An HTTP response establishes reachability, not vulnerability or authorization.",
          rows: arr(D.hosts),
          cols: [
            ["Endpoint", hostURL],
            ["HTTP status", "status_code"],
            ["Title", "title"],
            ["Server", "server"],
            ["IP", "ip"],
            ["Technologies", (r) => arr(r.tech_stack).join(", ")],
          ],
          detail: "record",
        },
        urls: {
          title: "URL explorer",
          note: "Every discovered URL is included. Filter and export the complete matching set; pagination only limits visible rows.",
          rows: arr(D.urls).map((url) => ({
            url,
            host: hostOf(url),
            category: classify(url),
          })),
          cols: [
            ["URL", "url"],
            ["Host", "host"],
            ["Category", "category"],
          ],
          filter: "category",
        },
        js: {
          title: "JavaScript inventory",
          note: "Discovered JavaScript URLs. Discovery is separate from successful download; check coverage notes for download failures.",
          rows: arr(D.js_files).map((url) => ({ url, host: hostOf(url) })),
          cols: [
            ["JavaScript URL", "url"],
            ["Host", "host"],
          ],
        },
        params: {
          title: "Parameters & endpoints",
          note: "Complete query and tool parameter mappings. Parameter names are observations, not confirmed injection points.",
          rows: params,
          cols: [
            ["Parameter", "name"],
            ["Endpoint", "url"],
            ["Method", "method"],
            ["Source", "source"],
          ],
          filter: "source",
        },
        findings: {
          title: "Scanner findings",
          note: "Scanner matches require validation of impact. When Nuclei is skipped, zero findings means it was not run.",
          rows: arr(D.findings),
          cols: [
            ["Finding", "name"],
            ["Severity", "severity"],
            ["Target", "target"],
            ["Template", "template"],
            ["Discovered", "found_at"],
          ],
          filter: "severity",
          detail: "record",
        },
        secrets: {
          title: "Secret candidates",
          note: "Values are masked in this report and its exports. Review the source and impact before treating a detector match as a credential.",
          rows: arr(D.secrets),
          cols: [
            ["Detector", "type"],
            ["Source", "source"],
            ["File / URL", "file"],
            ["Masked value", "value"],
          ],
          filter: "source",
          detail: "record",
        },
        directories: {
          title: "Directory observations",
          note: "Optional content discovery results, including HTTP status and originating tool.",
          rows: arr(D.dir_results),
          cols: [
            ["URL", "url"],
            ["HTTP status", "status_code"],
            ["Size", "size"],
            ["Source", "tool"],
          ],
          filter: "tool",
          detail: "record",
        },
        cors: {
          title: "CORS observations",
          note: "Observations need browser-context validation; header patterns alone do not prove data access.",
          rows: arr(D.cors_results),
          cols: [
            ["URL", "url"],
            ["Origin", "origin"],
            ["Allow origin", "acao"],
            ["Credentials", "acac"],
          ],
          detail: "record",
        },
        cloud: {
          title: "Cloud observations",
          note: "Reachability and provider metadata do not prove that storage is publicly exposed.",
          rows: arr(D.cloud_assets),
          cols: [
            ["Asset", "name"],
            ["Provider", "provider"],
            ["URL", "url"],
            ["Status", "status"],
          ],
          filter: "provider",
          detail: "record",
        },
        waf: {
          title: "WAF observations",
          note: "Explicit detections and negative observations. Untested endpoints remain unknown; a parent hostname does not establish a subdomain’s status.",
          rows: arr(D.waf_results),
          cols: [
            ["Endpoint", "host"],
            ["WAF", "waf"],
            ["Detected", (r) => (r.detected ? "yes" : "no")],
          ],
          detail: "record",
        },
        phases: {
          title: "Phase coverage",
          note: "Skipped, partial and failed phases are shown separately. Zero results is never a substitute for completed coverage.",
          rows: phaseRows,
          cols: [
            ["Phase", "name"],
            ["State", "status"],
            ["Started", "started_at"],
            ["Finished", "finished_at"],
            ["Reason", "reason"],
          ],
          filter: "status",
          detail: "record",
        },
        sources: {
          title: "Source coverage",
          note: "Subdomain and URL source outcomes, progress and frozen completion times.",
          rows: arr(SCAN_DATA.sources),
          cols: [
            ["Source", "Name"],
            ["State", "State"],
            ["Hosts", (r) => (r.Total ? `${r.Processed}/${r.Total}` : "—")],
            ["Results", "Count"],
            ["Reason", "Message"],
          ],
          filter: "State",
          detail: "record",
        },
        tasks: {
          title: "Completed batch journal",
          note: "Successful HTTP and crawl batches retained for resume. Failed batches remain retryable and are listed in coverage notes.",
          rows: arr(SCAN_DATA.tasks),
          cols: [
            ["Tool", "tool"],
            ["Output lines", "results"],
            ["Duration", "duration"],
          ],
        },
      };
      function classify(raw) {
        try {
          const u = new URL(raw),
            p = u.pathname.toLowerCase();
          if (/\.(m?js|jsx)$/.test(p)) return "JavaScript";
          if (u.search) return "Parameters";
          if (/\/api\/|\/v[0-9]+\/|graphql/.test(p)) return "API";
          if (/login|admin|auth|account/.test(p)) return "Application";
          return "Other";
        } catch {
          return "Other";
        }
      }
      const definitions = [
        ["overview", "Overview"],
        ["assets", "Assets"],
        ["subdomains", "Subdomains"],
        ["hosts", "HTTP endpoints"],
        ["urls", "URLs"],
        ["js", "JavaScript"],
        ["params", "Parameters"],
        ["ports", "Ports (opt in)"],
        ["networks", "IP ranges"],
        ["screenshots", "Screenshots"],
        ["findings", "Scanner findings"],
        ["secrets", "Secret candidates"],
        ["directories", "Directories"],
        ["cors", "CORS"],
        ["cloud", "Cloud"],
        ["waf", "WAF"],
        ["phases", "Phase coverage"],
        ["sources", "Source coverage"],
        ["comparison", "Scan comparison"],
        ["tasks", "Batch journal"],
        ["coverage", "Coverage notes"],
        ["artifacts", "Evidence files"],
      ];
      let reviews = {};
      const reviewKey = "reconx-review-" + D.scan_id;
      try {
        reviews = JSON.parse(localStorage.getItem(reviewKey) || "{}");
      } catch {}
      function recordKey(r) {
        return JSON.stringify([
          r.template || r.type || r.name,
          r.target || r.file || r.url,
          r.source || "",
        ]);
      }
      for (const id of ["findings", "secrets"]) {
        tables[id].cols.push([
          "Review",
          (r) => reviews[recordKey(r)]?.status || "candidate",
        ]);
      }
      const states = {};
      let current = "overview";
      $("#targets").textContent = arr(SCAN_DATA.targets).join(" · ") || D.scan_id;
      $("#footer").textContent =
        `ReconX ${SCAN_DATA.version} · Scan ${D.scan_id} · Generated ${SCAN_DATA.generated_at} · Duration ${D.duration} · All collections included; visible tables are paginated.`;
      for (const [id, label] of definitions) {
        const b = node("button", label, "nav");
        b.dataset.page = id;
        const count = tables[id]?.rows.length;
        if (count !== undefined) b.append(node("span", fmt(count)));
        b.onclick = () => show(id);
        $("#navigation").append(b);
        const section = node("section", undefined, "section");
        section.id = id;
        $("#pages").append(section);
      }
      function heading(id, title, note) {
        const el = $("#" + id);
        el.append(node("h1", title), node("p", note, "muted intro"));
        return el;
      }
      function show(id) {
        if (!document.getElementById(id)) return;
        current = id;
        document
          .querySelectorAll(".section")
          .forEach((el) => el.classList.toggle("active", el.id === id));
        document
          .querySelectorAll(".nav")
          .forEach((el) => el.classList.toggle("active", el.dataset.page === id));
        if (tables[id] && !states[id]) initTable(id);
        history.replaceState(null, "", "#" + id);
        window.scrollTo(0, 0);
      }
      function value(r, key) {
        return typeof key === "function" ? key(r) : (r[key] ?? "");
      }
      function initTable(id) {
        const def = tables[id],
          section = heading(id, def.title, def.note),
          toolbar = node("div", undefined, "toolbar"),
          search = node("input");
        search.type = "search";
        search.placeholder = "Search every row…";
        search.setAttribute("aria-label", "Search " + def.title);
        const selector = node("select");
        selector.setAttribute("aria-label", "Filter " + def.title);
        selector.append(new Option("All " + (def.filter || "rows"), ""));
        if (def.filter)
          [...new Set(def.rows.map((r) => String(r[def.filter] ?? "")))]
            .sort()
            .forEach((v) => selector.append(new Option(v || "(empty)", v)));
        else selector.hidden = true;
        const exportButton = node("button", "Export matching CSV");
        toolbar.append(search, selector, exportButton);
        section.append(toolbar);
        const panel = node("div", undefined, "panel table-panel"),
          scroll = node("div", undefined, "scroll"),
          table = node("table"),
          thead = node("thead"),
          tr = node("tr");
        def.cols.forEach(([label, key], index) => {
          const th = node("th", label);
          th.tabIndex = 0;
          const sort = () => {
            const s = states[id];
            s.ascending = s.sort === index ? !s.ascending : true;
            s.sort = index;
            draw(id);
          };
          th.onclick = sort;
          th.onkeydown = (e) => {
            if (e.key === "Enter") sort();
          };
          tr.append(th);
        });
        thead.append(tr);
        table.append(thead, node("tbody"));
        scroll.append(table);
        const pager = node("div", undefined, "pager"),
          info = node("span"),
          controls = node("div"),
          prev = node("button", "← Previous"),
          next = node("button", "Next →");
        controls.append(prev, next);
        pager.append(info, controls);
        panel.append(scroll, pager);
        section.append(panel);
        states[id] = {
          query: "",
          filter: "",
          page: 0,
          sort: null,
          ascending: true,
          tbody: table.tBodies[0],
          info,
          prev,
          next,
          search,
          selector,
        };
        let timer;
        search.oninput = () => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            states[id].query = search.value.toLowerCase();
            states[id].page = 0;
            draw(id);
          }, 160);
        };
        selector.onchange = () => {
          states[id].filter = selector.value;
          states[id].page = 0;
          draw(id);
        };
        prev.onclick = () => {
          states[id].page--;
          draw(id);
        };
        next.onclick = () => {
          states[id].page++;
          draw(id);
        };
        exportButton.onclick = () => exportCSV(id);
        draw(id);
      }
      function matching(id) {
        const def = tables[id],
          s = states[id];
        let rows = def.rows.filter(
          (r) =>
            (!s.filter || String(r[def.filter]) === s.filter) &&
            (!s.query ||
              def.cols.some(([, key]) =>
                String(value(r, key)).toLowerCase().includes(s.query),
              )),
        );
        if (s.sort !== null) {
          const key = def.cols[s.sort][1];
          rows = rows.slice().sort((a, b) => {
            const av = value(a, key),
              bv = value(b, key);
            return (
              (typeof av === "number" && typeof bv === "number"
                ? av - bv
                : String(av).localeCompare(String(bv))) * (s.ascending ? 1 : -1)
            );
          });
        }
        return rows;
      }
      function draw(id) {
        const def = tables[id],
          s = states[id],
          rows = matching(id),
          size = 100;
        s.page = Math.max(
          0,
          Math.min(s.page, Math.max(0, Math.ceil(rows.length / size) - 1)),
        );
        s.tbody.replaceChildren();
        for (const r of rows.slice(s.page * size, (s.page + 1) * size)) {
          const tr = node("tr");
          def.cols.forEach(([label, key], index) => {
            const v = value(r, key),
              td = node("td");
            if (index === 0 && def.detail) {
              const b = node("button", v, "link-button");
              b.onclick = () =>
                def.detail === "asset"
                  ? openAsset(assets.get(r.host) || r)
                  : openRecord(r);
              td.append(b);
            } else if (id === "artifacts" && index === 0) {
              const a = node("a", v);
              if (!String(v).includes("..") && !String(v).startsWith("/")) {
                a.href = v;
                a.download = "";
              }
              td.append(a);
            } else if (["State", "Severity", "WAF"].includes(label))
              td.append(pill(v));
            else if (/^https?:\/\//.test(String(v))) td.append(safeLink(String(v)));
            else td.textContent = String(v);
            tr.append(td);
          });
          s.tbody.append(tr);
        }
        if (!rows.length) {
          const tr = node("tr"),
            td = node(
              "td",
              "No matching records. Review phase coverage to distinguish skipped work from completed work.",
              "empty",
            );
          td.colSpan = def.cols.length;
          tr.append(td);
          s.tbody.append(tr);
        }
        s.info.textContent = `${fmt(rows.length ? s.page * size + 1 : 0)}–${fmt(Math.min((s.page + 1) * size, rows.length))} of ${fmt(rows.length)} matching · ${fmt(def.rows.length)} total`;
        s.prev.disabled = s.page === 0;
        s.next.disabled = (s.page + 1) * size >= rows.length;
      }
      function download(name, data, type) {
        const url = URL.createObjectURL(new Blob([data], { type })),
          a = node("a");
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function exportCSV(id) {
        const def = tables[id],
          cell = (v) => {
            v = String(v ?? "");
            if (/^[=+@\-\t\r]/.test(v)) v = "'" + v;
            return '"' + v.replaceAll('"', '""') + '"';
          };
        const rows = [
          def.cols.map(([label]) => cell(label)).join(","),
          ...matching(id).map((r) =>
            def.cols.map(([, key]) => cell(value(r, key))).join(","),
          ),
        ];
        download(
          `reconx-${id}.csv`,
          "\uFEFF" + rows.join("\r\n"),
          "text/csv;charset=utf-8",
        );
      }
      function drawer(title) {
        $("#drawer-title").textContent = title;
        $("#drawer-content").replaceChildren();
        $("#drawer").hidden = false;
        $("#close-drawer").focus();
        return $("#drawer-content");
      }
      function openRecord(r) {
        const el = drawer(
          r.name || r.type || r.url || r.Name || "Evidence & metadata",
        );
        el.append(
          node(
            "p",
            "Recorded observation. Validate impact before reporting.",
            "muted",
          ),
        );
        el.append(node("pre", JSON.stringify(r, null, 2)));
        const controls = node("div", undefined, "panel");
        controls.append(node("h2", "Manual review"));
        const select = node("select");
        select.setAttribute("aria-label", "Review status");
        for (const status of ["candidate", "reviewed", "false positive", "confirmed"])
          select.append(new Option(status, status));
        const key = recordKey(r);
        select.value = reviews[key]?.status || "candidate";
        const note = node("textarea");
        note.setAttribute("aria-label", "Review notes");
        note.placeholder = "Evidence and impact notes (local to this browser)";
        note.value = reviews[key]?.note || "";
        note.style.cssText = "display:block;width:100%;min-height:90px;margin:12px 0";
        const save = node("button", "Save local review");
        const message = node(
          "p",
          "Local annotation only. Export JSON to carry reviews with you.",
          "muted",
        );
        save.onclick = () => {
          reviews[key] = { status: select.value, note: note.value.slice(0, 4000) };
          SCAN_DATA.reviews = reviews;
          try {
            localStorage.setItem(reviewKey, JSON.stringify(reviews));
            message.textContent =
              "Saved locally. Export JSON to preserve your annotations.";
          } catch {
            message.textContent =
              "Browser storage unavailable; use Export JSON before closing.";
          }
          for (const id of ["findings", "secrets"]) if (states[id]) draw(id);
        };
        controls.append(select, note, save, message);
        el.append(controls);
        if (
          r.image &&
          r.image.startsWith("screenshots/") &&
          !r.image.includes("..")
        ) {
          const img = node("img");
          img.src = r.image;
          img.alt = "Screenshot of " + r.host;
          el.append(img);
        }
      }
      function openAsset(a) {
        const el = drawer(a.host);
        el.append(
          node(
            "p",
            a.sources.join(" · ") || "Discovered from collected results",
            "muted",
          ),
        );
        const stats = node("div", undefined, "stat-inline");
        for (const [label, count] of [
          ["URLs", a.urls],
          ["JavaScript", a.js],
          ["Parameters", a.parameters],
        ]) {
          const d = node("div");
          d.append(node("strong", fmt(count)), node("span", label, "muted"));
          stats.append(d);
        }
        el.append(stats);
        const chips = node("div", undefined, "chipset");
        a.technologies.forEach((t) => chips.append(pill(t)));
        chips.append(
          pill("WAF " + a.waf, a.waf === "unknown" ? "unknown" : "positive"),
        );
        el.append(chips);
        for (const h of a.endpoints) {
          const row = node("div", undefined, "row");
          row.append(safeLink(hostURL(h)), pill(h.status_code));
          el.append(row);
        }
        for (const [id, label] of [
          ["urls", "Explore URLs"],
          ["js", "Explore JavaScript"],
          ["params", "Explore parameters"],
          ["findings", "Review scanner matches"],
          ["secrets", "Review secret candidates"],
        ]) {
          const b = node("button", label);
          b.style.margin = "12px 8px 0 0";
          b.onclick = () => {
            $("#drawer").hidden = true;
            show(id);
            states[id].query = a.host;
            states[id].search.value = a.host;
            states[id].page = 0;
            draw(id);
          };
          el.append(b);
        }
        const screenshot = SCAN_DATA.screenshots?.[a.host];
        if (
          screenshot &&
          !screenshot.includes("..") &&
          screenshot.startsWith("screenshots/")
        ) {
          el.append(node("h2", "Screenshot"));
          const img = node("img");
          img.src = screenshot;
          img.alt = "Screenshot of " + a.host;
          img.loading = "lazy";
          el.append(img);
        }
      }
      $("#close-drawer").onclick = () => {
        $("#drawer").hidden = true;
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") $("#drawer").hidden = true;
      });
      $("#theme").onclick = () => {
        document.body.classList.toggle("dark");
        $("#theme").textContent = document.body.classList.contains("dark")
          ? "Light mode"
          : "Dark mode";
      };
      $("#export-all").onclick = () =>
        download(
          "reconx-report-data.json",
          JSON.stringify({ ...SCAN_DATA, reviews }, null, 2),
          "application/json",
        );
      $("#print").onclick = () => window.print();
      const overview = heading(
        "overview",
        "Reconnaissance, connected.",
        "Your assets, evidence and coverage in one place. Searchable offline, without truncating collected results.",
      );
      const incomplete = phaseRows.filter((p) =>
        ["partial", "failed", "running", "error"].includes(p.status),
      );
      const banner = node("div", undefined, "banner");
      banner.append(
        node(
          "strong",
          incomplete.length
            ? `${incomplete.length} phase(s) have incomplete coverage. `
            : "Interpret results with coverage. ",
        ),
        node(
          "span",
          `Ports: ${phaseStatus("ports")}. Nuclei: ${phaseStatus("vulnerabilities")}. Zero findings does not establish a clean assessment.`,
        ),
      );
      overview.append(banner);
      const cards = node("div", undefined, "cards");
      for (const [id, label, count, note] of [
        ["assets", "Discovered assets", assets.size, "Connected host profiles"],
        [
          "hosts",
          "Live HTTP endpoints",
          arr(D.hosts).length,
          "HTTP and HTTPS counted separately",
        ],
        [
          "urls",
          "Discovered URLs",
          arr(D.urls).length,
          "Complete collection, searchable",
        ],
        [
          "js",
          "JavaScript files",
          arr(D.js_files).length,
          "Download coverage listed separately",
        ],
        [
          "params",
          "Parameter mappings",
          params.length,
          "All recorded endpoint mappings",
        ],
        [
          "findings",
          "Scanner findings",
          arr(D.findings).length,
          phaseStatus("vulnerabilities") === "skipped"
            ? "Nuclei skipped"
            : "Requires impact validation",
        ],
        [
          "secrets",
          "Secret candidates",
          arr(D.secrets).length,
          "Masked values; manual review",
        ],
        [
          "coverage",
          "Coverage notes",
          arr(D.coverage).length,
          "Limits, exclusions and failures",
        ],
      ]) {
        const c = node("div", undefined, "card");
        c.tabIndex = 0;
        c.setAttribute("role", "button");
        c.append(
          node("div", label, "label"),
          node("div", fmt(count), "number"),
          node("div", note, "note"),
        );
        c.onclick = () => show(id);
        c.onkeydown = (e) => {
          if (e.key === "Enter") show(id);
        };
        cards.append(c);
      }
      overview.append(cards);
      const grid = node("div", undefined, "grid"),
        phases = node("div", undefined, "panel"),
        sources = node("div", undefined, "panel");
      phases.append(node("h2", "Execution & coverage"));
      if (!phaseRows.length)
        phases.append(
          node(
            "p",
            "No phase manifest recorded. Coverage cannot be inferred from result counts.",
            "muted",
          ),
        );
      phaseRows.forEach((p) => {
        const row = node("div", undefined, "row");
        row.append(node("span", p.name), pill(p.status));
        phases.append(row);
      });
      sources.append(node("h2", "Discovery sources"));
      const sourceCounts = new Map();
      arr(D.subdomain_sources).forEach((s) =>
        sourceCounts.set(
          s.source || "unknown",
          (sourceCounts.get(s.source || "unknown") || 0) + 1,
        ),
      );
      const maxSource = Math.max(1, ...sourceCounts.values());
      [...sourceCounts]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .forEach(([name, count]) => {
          const row = node("div", undefined, "row");
          row.append(node("span", name), node("strong", fmt(count)));
          const bar = node("div", undefined, "bar"),
            i = node("i");
          i.style.width = (count / maxSource) * 100 + "%";
          bar.append(i);
          sources.append(row, bar);
        });
      sources.append(
        node(
          "p",
          "First discovery source attribution; counts are not independent confirmations.",
          "muted",
        ),
      );
      grid.append(phases, sources);
      overview.append(grid);
      const cov = heading(
        "coverage",
        "Coverage & limitations",
        "Recorded limits are preserved. Budget stops retain partial evidence and remain retryable.",
      );
      arr(D.coverage).forEach((note) =>
        cov.append(node("div", note, "coverage-item")),
      );
      if (!arr(D.coverage).length)
        cov.append(
          node(
            "p",
            "No coverage notes were recorded. This does not guarantee exhaustive testing.",
            "muted",
          ),
        );
      if (SCAN_DATA.scope) {
        cov.append(
          node("h2", "Configured scope"),
          node("pre", JSON.stringify(SCAN_DATA.scope, null, 2), "panel mono"),
        );
      }

      show(location.hash.slice(1) || "overview");
    </script>
  </body>
</html>
