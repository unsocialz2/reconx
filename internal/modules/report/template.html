<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ReconX · Reconnaissance workspace</title>
    <style>
      :root {
        --bg: #f4f6fa;
        --panel: #fff;
        --ink: #152334;
        --muted: #66778a;
        --line: #e0e6ed;
        --teal: #007f78;
        --soft: #e6f5f1;
        --amber: #95630c;
        --red: #ba3842;
        --nav: #101e2b;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.55 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI Emoji",
          "Apple Color Emoji",
          "Noto Color Emoji",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a {
        cursor: pointer;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        background: var(--panel);
        color: var(--ink);
      }
      button:hover {
        border-color: var(--teal);
      }
      a {
        color: var(--teal);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #49b9ae;
        outline-offset: 2px;
      }
      .app {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100vh;
      }
      aside {
        background: var(--nav);
        color: #b7c6d5;
        padding: 29px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
      }
      .brand {
        font-size: 25px;
        letter-spacing: -1px;
        font-weight: 800;
        color: #fff;
        padding: 0 12px;
      }
      .brand em {
        font-style: normal;
        color: #4fdbc1;
      }
      .edition {
        padding: 2px 12px 28px;
        font-size: 11px;
        letter-spacing: 2px;
        color: #8aa1b6;
      }
      .nav-caption {
        font-size: 10px;
        letter-spacing: 1.6px;
        color: #8095a9;
        padding: 15px 12px 8px;
      }
      .nav {
        display: flex;
        align-items: center;
        width: 100%;
        border: 0;
        background: none;
        color: #b7c6d5;
        text-align: left;
        padding: 10px 12px;
        margin: 3px 0;
        border-radius: 9px;
        gap: 9px;
      }
      .nav.active {
        background: #213d46;
        color: #75e6ce;
      }
      .nav span {
        margin-left: auto;
        color: #8ba6b8;
        font:
          11px ui-monospace,
          monospace;
      }
      .aside-note {
        margin: 30px 12px 0;
        border-top: 1px solid #2b3c4d;
        padding-top: 18px;
        font-size: 11px;
        color: #8ca1b4;
      }
      .main {
        padding: 28px 34px 40px;
        min-width: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 30px;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
      }
      .target {
        font-size: 18px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .offline {
        font-size: 11px;
        color: var(--teal);
        background: var(--soft);
        padding: 5px 10px;
        border-radius: 20px;
        white-space: nowrap;
      }
      h1 {
        font-size: 31px;
        letter-spacing: -1px;
        margin: 0 0 5px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 15px;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
      }
      .intro {
        margin-bottom: 22px;
      }
      .banner {
        border: 1px solid #e9d7a7;
        background: #fff8e7;
        color: #725217;
        padding: 14px 18px;
        border-radius: 10px;
        margin: 0 0 24px;
        overflow-wrap: anywhere;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 23px;
      }
      .card,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 21px;
      }
      .card {
        cursor: pointer;
      }
      .card:hover {
        box-shadow: 0 5px 16px #1633440b;
        border-color: #72b8af;
      }
      .card .label {
        font-size: 12px;
        color: var(--muted);
      }
      .card .number {
        font-size: 31px;
        font-weight: 750;
        letter-spacing: -1px;
        margin: 7px 0 2px;
      }
      .card .note {
        font-size: 11px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 18px;
        margin-bottom: 18px;
      }
      .panel {
        min-width: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .pill {
        display: inline-block;
        font-size: 11px;
        line-height: 1.3;
        border-radius: 6px;
        background: var(--bg);
        color: var(--muted);
        padding: 5px 8px;
        white-space: nowrap;
      }
      .completed,
      .done,
      .positive {
        color: #126c5a;
        background: #e4f4ec;
      }
      .partial,
      .stale,
      .timeout,
      .unknown {
        color: #94620c;
        background: #fff2d6;
      }
      .error,
      .failed,
      .critical,
      .high {
        color: var(--red);
        background: #fce9eb;
      }
      .medium {
        color: #94620c;
        background: #fff2d6;
      }
      .bar {
        height: 6px;
        background: var(--bg);
        border-radius: 5px;
        overflow: hidden;
        margin: 5px 0 13px;
      }
      .bar i {
        height: 100%;
        display: block;
        background: #30a495;
        border-radius: 5px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .toolbar input {
        flex: 1;
        min-width: 200px;
      }
      .toolbar input,
      .toolbar select {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        padding: 10px 12px;
        color: var(--ink);
      }
      .table-panel {
        padding: 0;
        overflow: hidden;
      }
      .scroll {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th {
        background: var(--bg);
        text-align: left;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        white-space: nowrap;
        padding: 12px 17px;
        cursor: pointer;
      }
      td {
        padding: 13px 17px;
        border-top: 1px solid var(--line);
        max-width: 500px;
        overflow-wrap: anywhere;
        vertical-align: top;
      }
      tr:hover td {
        background: #6aab9b08;
      }
      .link-button {
        padding: 0;
        border: 0;
        color: var(--teal);
        background: none;
        text-align: left;
      }
      .mono {
        font:
          11px/1.5 ui-monospace,
          SFMono-Regular,
          monospace;
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 17px;
        gap: 10px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .empty {
        text-align: center;
        padding: 55px 20px;
        color: var(--muted);
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .coverage-item {
        border-left: 3px solid #dfb15b;
        padding: 12px 16px;
        background: var(--panel);
        border-radius: 0 8px 8px 0;
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
      .drawer {
        position: fixed;
        right: 0;
        top: 0;
        height: 100vh;
        width: min(720px, 95vw);
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -20px 0 80px #0d203322;
        z-index: 5;
        padding: 30px;
        overflow: auto;
      }
      .drawer header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 20px;
      }
      .drawer h2 {
        font-size: 22px;
        overflow-wrap: anywhere;
      }
      .drawer pre {
        font:
          12px/1.6 ui-monospace,
          monospace;
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 16px;
        border-radius: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .drawer img {
        max-width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
      }
      [hidden] {
        display: none !important;
      }
      .footer {
        margin-top: 27px;
        font-size: 11px;
        color: var(--muted);
      }
      .stat-inline {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 15px 0;
      }
      .stat-inline > div {
        background: var(--bg);
        padding: 12px;
        border-radius: 8px;
      }
      .stat-inline strong {
        display: block;
        font-size: 22px;
      }
      .chipset {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0 15px;
      }
      .dark {
        --bg: #101922;
        --panel: #16232f;
        --ink: #e4edf3;
        --muted: #a0b1bf;
        --line: #2c3c49;
        --teal: #6adac6;
        --soft: #1d3c37;
      }
      .dark .banner {
        background: #342c1d;
        border-color: #635431;
        color: #e9d59e;
      }
      .dark .completed,
      .dark .done,
      .dark .positive {
        background: #163b30;
        color: #82dfbc;
      }
      .dark .partial,
      .dark .stale,
      .dark .timeout,
      .dark .unknown {
        background: #3c3017;
        color: #edcd83;
      }
      .dark .error,
      .dark .high,
      .dark .critical {
        background: #40242b;
        color: #ffa5ab;
      }
      .theme-label {
        font-size: 12px;
      }
      @media (max-width: 1000px) {
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .main {
          padding: 22px;
        }
        .app {
          grid-template-columns: 190px minmax(0, 1fr);
        }
      }
      @media (max-width: 680px) {
        .app {
          display: block;
        }
        aside {
          position: relative;
          height: auto;
          padding: 18px;
        }
        .edition,
        .nav-caption,
        .aside-note {
          display: none;
        }
        nav {
          display: flex;
          overflow: auto;
          margin-top: 14px;
        }
        .nav {
          width: auto;
          white-space: nowrap;
          flex: none;
        }
        .brand {
          font-size: 21px;
        }
        .main {
          padding: 20px 14px;
        }
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }
        .cards {
          gap: 9px;
        }
        .card {
          padding: 15px;
        }
        h1 {
          font-size: 26px;
        }
        .actions {
          flex-wrap: wrap;
        }
      }
      @media print {
        aside,
        .toolbar,
        .actions,
        .pager,
        .drawer,
        button {
          display: none !important;
        }
        .app {
          display: block;
        }
        .main {
          padding: 0;
        }
        .section {
          display: block !important;
          break-inside: avoid;
        }
        .cards {
          grid-template-columns: repeat(4, 1fr);
        }
        body {
          background: white;
          color: #111;
        }
        .panel,
        .card {
          box-shadow: none;
        }
        .scroll {
          overflow: visible;
        }
        .section:not(#overview) {
          margin-top: 30px;
        }
        .footer:after {
          content: " · Use the interactive HTML or CSV/JSON exports for the complete dataset.";
        }
      }
      /* Offline intelligence dashboard: no external fonts, scripts or assets. */
      :root {
        --bg: #edf2f8;
        --panel: #ffffff;
        --ink: #182940;
        --muted: #61758e;
        --line: #dce5f0;
        --teal: #007d77;
        --soft: #dcf7f0;
        --radius: 18px;
        --nav: #0b1426;
        --shadow: 0 8px 30px #19324b08;
      }
      .dark {
        --bg: #0a1020;
        --panel: #111c30;
        --ink: #edf3ff;
        --muted: #9aaec9;
        --line: #22324d;
        --teal: #62e4c0;
        --soft: #163a37;
        --nav: #090f1d;
        --shadow: 0 10px 34px #00000017;
        --red: #ff96a8;
      }
      body {
        background:
          radial-gradient(ellipse at 85% 0%, #53b3e50b, transparent 55%),
          var(--bg);
      }
      button {
        transition:
          border-color 0.18s,
          background 0.18s,
          transform 0.18s;
      }
      button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      .app {
        grid-template-columns: 246px minmax(0, 1fr);
      }
      aside {
        border-right: 1px solid #21304a;
        padding: 27px 14px;
        scrollbar-width: thin;
        scrollbar-color: #334461 transparent;
      }
      .brand {
        padding: 0 10px;
        letter-spacing: -1.2px;
        font-size: 29px;
        display: flex;
        align-items: center;
        gap: 0;
      }
      .brand-icon {
        font-size: 27px;
        margin-right: 8px;
      }
      .edition {
        padding: 8px 12px 20px;
        letter-spacing: 2.6px;
        color: #92a4bf;
        font-size: 9px;
      }
      .nav {
        padding: 10px 12px;
        font-size: 12px;
        gap: 10px;
        border: 1px solid transparent;
      }
      .nav-icon {
        font-style: normal;
        width: 23px;
        font-size: 16px;
        text-align: center;
        flex-shrink: 0;
      }
      .nav:hover {
        background: #17243a;
        color: #fff;
        border-color: transparent;
      }
      .nav.active {
        color: #83f4d3;
        background: linear-gradient(100deg, #1b453f, #122b31);
        border-color: #2c6156;
        box-shadow: inset 3px 0 #63dfb9;
      }
      .nav span {
        border-radius: 5px;
        padding: 2px 6px;
        background: #ffffff09;
        font-size: 10px;
      }
      .nav-caption {
        padding-top: 22px;
        color: #778ba9;
        font-weight: 700;
      }
      aside > .nav-caption {
        display: none;
      }
      .main {
        padding: 28px 32px 40px;
        max-width: 1900px;
        width: 100%;
        margin: 0 auto;
      }
      .topbar {
        margin-bottom: 24px;
        padding-bottom: 21px;
        border-bottom: 1px solid var(--line);
      }
      .target {
        font-size: 17px;
        margin-top: 5px;
      }
      .eyebrow {
        font-size: 9px;
        letter-spacing: 1.7px;
      }
      .actions button {
        font-size: 11px;
        padding: 8px 10px;

      }
      .offline {
        font-size: 10px;
        border: 1px solid #39977f33;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
      }
      h2 {
        font-size: 15px;
        letter-spacing: -0.2px;
      }
      .section-icon {
        font-size: 0.85em;
        margin-right: 10px;
      }
      .intro {
        max-width: 850px;
        font-size: 13px;
        margin-top: 9px;
      }
      .hero {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 32px 34px;
        margin-bottom: 20px;
        border-radius: 22px;
        border: 1px solid #36556c;
        background:
          radial-gradient(ellipse at 92% 40%, #367c6c70, transparent 57%),
          linear-gradient(115deg, #13233e, #122e3a);
        box-shadow: 0 15px 45px #07102318;
        color: #f2f7ff;
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.13;
        background-image:
          linear-gradient(#77afcf55 1px, transparent 1px),
          linear-gradient(90deg, #77afcf55 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(90deg, transparent, #000);
      }
      .hero h1 {
        font-size: clamp(27px, 2.6vw, 43px);
        margin: 10px 0;
        letter-spacing: -1.6px;
      }
      .hero .section-icon {
        display: none;
      }
      .hero .intro {
        margin-bottom: 20px;
        color: #b7cddd;
        max-width: 540px;
        font-size: 13px;
      }
      .hero-kicker {
        font-size: 9px;
        letter-spacing: 2.4px;
        font-weight: 750;
        color: #8be8cd;
      }
      .hero-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .hero-meta span {
        padding: 5px 9px;
        border: 1px solid #84b7c02b;
        border-radius: 7px;
        background: #06142a2b;
        font-size: 10px;
        color: #d8e7f2;
        overflow-wrap: anywhere;
      }
      .hero-seal {
        flex-shrink: 0;
        width: 170px;
        height: 170px;
        border-radius: 50%;
        border: 1px solid #70ddc04a;
        background: repeating-radial-gradient(
          circle,
          #69c7b00b 0 27px,
          #77dbbe33 28px 29px,
          transparent 30px 38px
        );

        align-items: center;
        justify-content: center;
        flex-direction: column;
        box-shadow: 0 0 50px #68d8bb18;
      }
      .hero-seal span {
        font-size: 56px;
        filter: drop-shadow(0 4px 20px #8af9d74a);
      }
      .hero-seal small {
        font-size: 7px;
        letter-spacing: 1.5px;
        margin-top: 7px;
        color: #9de5d5;
      }
      .banner {
        font-size: 12px;
        padding: 12px 17px;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      .dark .banner {
        background: #342b1a;
        border-color: #67512d;
        color: #f2d99e;
      }
      .cards {
        gap: 13px;
        margin-bottom: 20px;
      }
      .card,
      .panel {
        box-shadow: var(--shadow);
      }
      .card {
        position: relative;
        padding: 19px;
        overflow: hidden;
        border-top: 2px solid #51cba25c;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          border-color 0.2s;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px #12233817;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .metric-icon {
        display: grid;
        place-items: center;
        width: 35px;
        height: 35px;
        border: 1px solid #61cdbb33;
        border-radius: 10px;
        background: #51cba210;
        font-size: 19px;
      }
      .metric-arrow {
        color: var(--muted);
        font-size: 15px;
      }
      .card .label {
        font-size: 11px;
        font-weight: 600;
      }
      .card .number {
        font-size: 33px;
        line-height: 1.25;
        margin: 5px 0;
        font-variant-numeric: tabular-nums;
      }
      .card .note {
        font-size: 10px;
        line-height: 1.6;
      }
      .card[data-metric="unavailable"] {
        border-top-color: #ff809699;
      }
      .card[data-metric="unavailable"] .metric-icon {
        background: #ff809610;
        border-color: #ff809633;
      }
      .card[data-metric="urls"],
      .card[data-metric="js"] {
        border-top-color: #69a9ff88;
      }
      .card[data-metric="findings"],
      .card[data-metric="secrets"] {
        border-top-color: #b89aff88;
      }
      .grid {
        gap: 18px;
      }
      .insight-grid {
        grid-template-columns: 1.1fr 1fr;
      }
      .panel {
        padding: 23px;
      }
      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .panel-heading h2 {
        margin: 0;
      }
      .panel-note {
        font-size: 11px;
        margin: 10px 0 20px;
      }
      .health-body {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .health-ring {
        flex: 0 0 154px;
        width: 154px;
        height: 154px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        padding: 13px;

  <body class="dark">
    <div class="app">
      <aside>
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">🛰️</span> recon<em>x</em
          ><span
            style="
              font-size: 11px;

              letter-spacing: 0;
              color: #8ca1b4;
            "
            >1.2</span
          >

        <div class="nav-caption">SCAN REFERENCE</div>
        <nav id="navigation"></nav>

          Self-contained report<br />All data stays in this file.<br /><br />Matches
          need impact review.<br />Skipped does not mean clean.
        </div>
      </aside>
      <main class="main">

            ><button id="theme" aria-label="Toggle color theme">

            ><button id="print">🖨️ Print</button>

    <section
      class="drawer"
      id="drawer"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Result details"
    >
      <header>
        <h2 id="drawer-title"></h2>
        <button id="close-drawer" aria-label="Close details">Close ×</button>
      </header>
      <div id="drawer-content"></div>
    </section>
    <script id="scan-data" type="application/json">
      {{.JSON}}
    </script>
    <script>
      "use strict";
      const SCAN_DATA = JSON.parse(
          document.getElementById("scan-data").textContent,
        ),
        D = SCAN_DATA.data;
      const $ = (s) => document.querySelector(s),
        arr = (x) => (Array.isArray(x) ? x : []),
        fmt = (x) => Number(x || 0).toLocaleString(),
        hostOf = (raw) => {
          try {
            return new URL(
              raw.includes("://") ? raw : "https://" + raw,
            ).hostname
              .toLowerCase()
              .replace(/\.$/, "");
          } catch {
            return "";
          }
        },
        hostURL = (h) => h.meta?.url || "https://" + h.domain;
      const node = (tag, text, cls) => {
        const el = document.createElement(tag);
        if (text !== undefined) el.textContent = String(text);
        if (cls) el.className = cls;
        return el;
      };
      const pill = (text, cls = text) =>
        node(
          "span",
          text,
          "pill " +
            String(cls)
              .toLowerCase()
              .replace(/[^a-z-]/g, ""),
        );
      const safeLink = (raw) => {
        try {
          const u = new URL(raw);
          if (!["http:", "https:"].includes(u.protocol))
            return node("span", raw);
          const a = node("a", raw);
          a.href = u.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          return a;
        } catch {
          return node("span", raw);
        }
      };
      // Derive complete query mappings once. Reuse URL string references instead
      // of serializing every URL twice into the HTML document.
      const allParameters = arr(SCAN_DATA.parameters).slice();
      const queryNamesByURL = new Map();
      for (const p of allParameters) {
        if (p.source === "URL query") {
          if (!queryNamesByURL.has(p.url))
            queryNamesByURL.set(p.url, new Set());
          queryNamesByURL.get(p.url).add(p.name);
        }
      }
      for (const raw of arr(D.urls)) {
        try {
          const u = new URL(raw);
          if (!u.search) continue;
          const names = new Set(u.searchParams.keys());
          for (const name of names) {
            if (!queryNamesByURL.get(raw)?.has(name))
              allParameters.push({
                name,
                url: raw,
                method: "GET",
                source: "URL query",
              });
          }
        } catch {}
      }
      SCAN_DATA.parameters = allParameters;
      const assets = new Map();
      function asset(h) {
        if (!h) return null;
        if (!assets.has(h))
          assets.set(h, {
            host: h,
            sources: [],
            endpoints: [],
            urls: 0,
            js: 0,
            parameters: 0,
            findings: 0,
            secrets: 0,
            technologies: [],
            waf: "unknown",
          });
        return assets.get(h);
      }
      arr(D.subdomain_sources).forEach((s) => {
        const a = asset(s.subdomain);
        if (a && !a.sources.includes(s.source || "unknown"))
          a.sources.push(s.source || "unknown");
      });
      arr(D.hosts).forEach((h) => {
        const a = asset(hostOf(hostURL(h)));
        if (a) {
          a.endpoints.push(h);
          a.technologies = [
            ...new Set([...a.technologies, ...arr(h.tech_stack)]),
          ];
        }
      });
      arr(D.urls).forEach((u) => {
        const a = asset(hostOf(u));
        if (a) a.urls++;
      });
      arr(D.js_files).forEach((u) => {
        const a = asset(hostOf(u));
        if (a) a.js++;
      });
      arr(SCAN_DATA.parameters).forEach((p) => {
        const a = asset(hostOf(p.url));
        if (a) a.parameters++;
      });
      arr(D.findings).forEach((f) => {
        const a = asset(hostOf(f.target));
        if (a) a.findings++;
      });
      arr(D.secrets).forEach((s) => {
        const a = asset(hostOf(s.file || ""));
        if (a) a.secrets++;
      });
      // A directory-only or name-only asset may have no URL/HTTP entry.
      arr(SCAN_DATA.review_queue).forEach((p) => asset(p.host));
      arr(D.waf_results).forEach((w) => {
        const a = asset(hostOf(w.host));
        if (a) {
          if (w.detected) a.waf = "detected";
          else if (a.waf !== "detected") a.waf = "not detected";
        }
      });
      const wafByEndpoint = new Map();
      for (const w of arr(D.waf_results)) {
        try {
          const key = new URL(w.host).origin;
          wafByEndpoint.set(key, w.detected || wafByEndpoint.get(key) || false);
        } catch {}
      }
      for (const a of assets.values()) {
        if (a.waf !== "detected")
          a.waf =
            a.endpoints.length &&
            a.endpoints.every((h) => {
              try {
                return wafByEndpoint.get(new URL(hostURL(h)).origin) === false;
              } catch {
                return false;
              }
            })
              ? "not detected"
              : "unknown";
      }
      const params = arr(SCAN_DATA.parameters),
        phaseRows = Object.entries(SCAN_DATA.phases || {}).map(([name, p]) => ({
          name,
          ...p,
        }));
      const phaseStatus = (name) =>
        SCAN_DATA.phases?.[name]?.status || "not recorded";
      const comparisonRows = [];
      for (const [collection, change] of Object.entries(
        SCAN_DATA.comparison?.changes || {},
      )) {
        for (const state of ["added", "unobserved"])
          for (const item of arr(change[state]))
            comparisonRows.push({ collection, state, item });
      }
      const httpState = (code) => {
        if (code >= 200 && code < 300) return "available";
        if (code >= 300 && code < 400) return "redirect";
        if (code === 401 || code === 403) return "restricted";
        if (code === 429) return "rate-limited";
        if (code >= 400 && code < 500) return "client-error";
        if (code >= 500 && code < 600) return "unavailable";
        return "unknown";
      };
      const isLive = (h) =>
        h.status_code >= 200 && h.status_code < 500 && h.status_code !== 429;
      const httpRows = arr(D.hosts).map((h) => ({
        ...h,
        http_state: httpState(h.status_code),
      }));
      const liveRows = httpRows.filter(isLive);
      const httpGroups = [
        ["available", "✅", "Available · 2xx", "#38d9a9"],
        ["redirect", "↗️", "Redirect · 3xx", "#69a9ff"],
        ["restricted", "🔐", "Restricted · 401/403", "#b89aff"],
        ["client-error", "📄", "Other client errors · 4xx", "#a0afc4"],
        ["rate-limited", "⏳", "Rate limited · 429", "#ffc66d"],
        ["unavailable", "🚧", "Unavailable · 5xx", "#ff8096"],
        ["unknown", "❔", "Unverified", "#637388"],
      ];
      const httpCounts = Object.fromEntries(
        httpGroups.map(([key]) => [
          key,
          httpRows.filter((h) => h.http_state === key).length,
        ]),
      );
      const icons = {
        overview: "🛰️",
        assets: "🗂️",
        subdomains: "🌐",
        hosts: "💓",
        urls: "🔗",
        js: "⚡",
        params: "🎛️",
        ports: "🔌",
        networks: "📡",
        screenshots: "📸",
        findings: "🎯",
        secrets: "🔑",
        directories: "📁",
        cors: "🔀",
        cloud: "☁️",
        waf: "🛡️",
        phases: "🧭",
        sources: "📊",
        budgets: "⏱️",
        runs: "♻️",
        comparison: "🔄",
        tasks: "🧩",
        coverage: "⚠️",
        artifacts: "🧾",
        queue: "🎯",
        routes: "🧩",
      };
      const tables = {
        queue: {
          title: "Asset review queue",
          note: "Review interest, not vulnerability severity. Ready observations come first, unverified evidence next, rate-limited/unavailable hosts last. Scores use route clues, candidates and JS; counts never prove impact. Open an asset for suggested checks.",
          rows: arr(SCAN_DATA.review_queue),
          cols: [
            ["Host", "host"],
            ["Queue", "priority"],
            ["Interest /100", "score"],
            ["Availability", "availability"],
            ["URLs", "urls"],
            ["Route groups", "endpoint_groups"],
            ["JavaScript", "js_files"],
            ["Candidates", "candidates"],
            ["Why review", (r) => arr(r.reasons).join(" · ")],
          ],
          filter: "priority",
          detail: "asset",
        },
        routes: {
          title: "Endpoint route groups",
          note: "Offline heuristic: numeric, UUID and long hex path segments become placeholders; origins and path case stay separate. Query values/fragments are omitted. Grouping does not prove equivalent behavior or route liveness. Methods are only shown when recorded, otherwise unknown.",
          rows: arr(SCAN_DATA.endpoint_groups),
          cols: [
            ["Route template", "route"],
            ["Origin", "origin"],
            ["Host", "host"],
            ["URLs", "observations"],
            ["Query shapes", "query_shapes"],
            ["Parameter names", (r) => arr(r.parameters).join(", ")],
            [
              "Observed methods",
              (r) => arr(r.observed_methods).join(", ") || "unknown",
            ],
            ["Evidence", (r) => arr(r.evidence_sources).join(", ")],
            ["Review clues", (r) => arr(r.signals).join(" · ")],
          ],
          filter: "host",
          detail: "record",
        },
        budgets: {
          title: "Source budgets",
          note: "Latest recorded plans. Estimates are heuristics. Explicit total_timeout wins; adaptive caps preserve partial results. Successful cached batches are replayed, even after an execution budget expires.",
          rows: phaseRows.flatMap((p) =>
            arr(p.budgets).map((b) => ({ phase: p.name, ...b })),
          ),
          cols: [
            ["Phase", "phase"],
            ["Source", "tool"],
            ["Inputs", "inputs"],
            ["Workers", "workers"],
            ["Budget (s)", "seconds"],
            [
              "Estimate (s)",
              (r) => (r.mode === "adaptive" ? r.estimated_seconds : "—"),
            ],
            ["Mode", "mode"],
            ["Capped", (r) => (r.capped ? "yes" : "no")],
            ["Reason", "reason"],
          ],
          filter: "mode",
          detail: "record",
        },
        runs: {
          title: "Resume & retry history",
          note: "Runs preserve prior observations. Job counters cover resumable batch/WAF/Amass work; command attempts include other subprocesses. A successful selected retry does not prove whole-scan coverage. Downstream phases can be stale after upstream work changes.",
          rows: arr(SCAN_DATA.runs),
          cols: [
            ["Started", "started_at"],
            ["Mode", "mode"],
            ["State", "status"],
            ["Phases", (r) => arr(r.phases).join(", ") || "normal pipeline"],
            ["Sources", (r) => arr(r.sources).join(", ") || "phase sources"],
            ["Commands", (r) => r.tasks?.command_attempts || 0],
            ["Reused jobs", (r) => r.tasks?.reused || 0],
            ["Executed jobs", (r) => r.tasks?.executed || 0],
            ["Failed jobs", (r) => r.tasks?.failed || 0],
            ["Pending jobs", (r) => r.tasks?.pending || 0],
            ["Finished", "finished_at"],
          ],
          filter: "mode",
          detail: "record",
        },
        comparison: {
          title: "Scan comparison",
          note:
            SCAN_DATA.comparison?.note ||
            "Rebuild with --report-only CURRENT --compare-with PREVIOUS to compare stored observations without scanning.",
          rows: comparisonRows,
          cols: [
            ["Collection", "collection"],
            ["Observation", "state"],
            ["Asset / result", "item"],
          ],
          filter: "state",
        },
        assets: {
          title: "Asset inventory",
          note: "One profile per hostname. Open an asset to connect its endpoints, technologies and results.",
          rows: [...assets.values()],
          cols: [
            ["Host", "host"],
            ["HTTP endpoints", (r) => r.endpoints.length],
            ["URLs", "urls"],
            ["JavaScript", "js"],
            ["Parameters", "parameters"],
            ["WAF", "waf"],
            ["Technologies", (r) => r.technologies.join(", ")],
            ["Discovery source", (r) => r.sources.join(", ")],
          ],
          detail: "asset",
        },

          r.image &&
          r.image.startsWith("screenshots/") &&
          !r.image.includes("..")
        ) {
          const img = node("img");
          img.src = r.image;
          img.alt = "Screenshot of " + r.host;
          el.append(img);
        }
      }
      function openAsset(a) {
        const el = drawer(a.host);
        el.append(
          node(
            "p",
            a.sources.join(" · ") || "Discovered from collected results",
            "muted",
          ),
        );
        const stats = node("div", undefined, "stat-inline");
        for (const [label, count] of [
          ["URLs", a.urls],
          ["JavaScript", a.js],
          ["Parameters", a.parameters],
        ]) {
          const d = node("div");
          d.append(node("strong", fmt(count)), node("span", label, "muted"));
          stats.append(d);
        }
        el.append(stats);
        const plan = arr(SCAN_DATA.review_queue).find((p) => p.host === a.host);
        if (plan) {
          const panel = node("div", undefined, "panel");
          panel.append(
            node("h2", "🎯 Review plan"),
            node(
              "p",
              `${plan.priority} · interest ${plan.score}/100 · ${plan.availability}`,
              "muted",
            ),
          );
          panel.append(
            node(
              "p",
              "A heuristic review order, not a severity or vulnerability assessment. Host observations do not verify every route.",
              "muted",
            ),
          );
          const reasons = node("ul");
          arr(plan.reasons).forEach((reason) =>
            reasons.append(node("li", reason)),
          );
          panel.append(reasons, node("h3", "Suggested checks"));
          const checks = node("ul");
          arr(plan.suggested_checks).forEach((check) =>
            checks.append(node("li", check)),
          );
          panel.append(checks);
          el.append(panel);
        }
        const chips = node("div", undefined, "chipset");
        a.technologies.forEach((t) => chips.append(pill(t)));
        chips.append(
          pill("WAF " + a.waf, a.waf === "unknown" ? "unknown" : "positive"),
        );
        el.append(chips);
        for (const h of a.endpoints) {
          const row = node("div", undefined, "row");
          row.append(
            safeLink(hostURL(h)),
            pill(
              `${h.status_code || "—"} · ${httpState(h.status_code)}`,
              httpState(h.status_code),
            ),
          );
          el.append(row);
        }
        for (const [id, label] of [
          ["urls", "Explore URLs"],
          ["routes", "Explore route groups"],
          ["js", "Explore JavaScript"],
          ["params", "Explore parameters"],
          ["findings", "Review scanner matches"],
          ["secrets", "Review secret candidates"],
        ]) {
          const b = node("button", label);
          b.style.margin = "12px 8px 0 0";
          b.onclick = () => {
            $("#drawer").hidden = true;
            show(id);
            states[id].query = a.host;
            states[id].search.value = a.host;
            states[id].page = 0;
            draw(id);
          };
          el.append(b);
        }
        const screenshot = SCAN_DATA.screenshots?.[a.host];
        if (
          screenshot &&
          !screenshot.includes("..") &&
          screenshot.startsWith("screenshots/")
        ) {
          el.append(node("h2", "Screenshot"));
          const img = node("img");
          img.src = screenshot;
          img.alt = "Screenshot of " + a.host;
          img.loading = "lazy";
          el.append(img);
        }
      }
      $("#close-drawer").onclick = () => {
        $("#drawer").hidden = true;
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") $("#drawer").hidden = true;
      });
      try {
        document.body.classList.toggle(
          "dark",
          localStorage.getItem("reconx-theme") !== "light",
        );
      } catch {}
      function themeLabel() {
        $("#theme").textContent = document.body.classList.contains("dark")
          ? "☀️ Light mode"
          : "🌙 Dark mode";
      }
      themeLabel();
      $("#theme").onclick = () => {
        document.body.classList.toggle("dark");
        themeLabel();
        try {
          localStorage.setItem(
            "reconx-theme",
            document.body.classList.contains("dark") ? "dark" : "light",
          );
        } catch {}
      };
      $("#export-all").onclick = () =>
        download(
          "reconx-report-data.json",
          JSON.stringify({ ...SCAN_DATA, reviews }, null, 2),
          "application/json",
        );
      $("#export-notes").onclick = () =>
        download(
          "testing_notes.md",
          SCAN_DATA.testing_notes || "",
          "text/markdown;charset=utf-8",
        );
      $("#print").onclick = () => window.print();
      const overview = heading(
        "overview",
        "Your recon. In focus.",
        "Your assets, evidence and coverage in one place. Searchable offline, without truncating collected results.",
      );
      const incomplete = phaseRows.filter((p) =>
        [
          "partial",
          "failed",
          "running",
          "error",
          "timeout",
          "cancelled",
          "interrupted",
          "stale",
        ].includes(p.status),
      );
      const banner = node("div", undefined, "banner");
      banner.append(
        node(
          "strong",
          incomplete.length
            ? `${incomplete.length} phase(s) have incomplete coverage. `
            : "Interpret results with coverage. ",
        ),
        node(
          "span",
          `Ports: ${phaseStatus("ports")}. Nuclei: ${phaseStatus("vulnerabilities")}. Zero findings does not establish a clean assessment.`,
        ),
      );
      overview.classList.add("dashboard");
      const hero = node("div", undefined, "hero");
      const heroContent = node("div");
      heroContent.append(
        node("div", "RECONX / FIELD INTELLIGENCE", "hero-kicker"),
      );
      heroContent.append(
        overview.querySelector("h1"),
        overview.querySelector(".intro"),
      );
      const meta = node("div", undefined, "hero-meta");
      meta.append(
        node("span", "🎯 " + (arr(SCAN_DATA.targets).join(" · ") || D.scan_id)),
        node("span", "⏱️ " + (D.duration || "Not recorded")),
        node("span", "🔒 Local evidence"),
      );
      heroContent.append(meta);
      const seal = node("div", undefined, "hero-seal");
      seal.setAttribute("aria-hidden", "true");
      seal.append(node("span", "🛰️"), node("small", "SURFACE INTELLIGENCE"));
      hero.append(heroContent, seal);
      overview.prepend(hero);
      overview.append(banner);
      const cards = node("div", undefined, "cards");
      for (const [id, label, count, note] of [
        ["assets", "Discovered assets", assets.size, "Connected host profiles"],
        [
          "hosts",
          "Live HTTP seeds",
          liveRows.length,
          "2xx–4xx except 429; not all successful",
        ],
        [
          "urls",
          "Discovered URLs",
          arr(D.urls).length,
          "Complete collection, searchable",
        ],
        [
          "js",
          "JavaScript files",
          arr(D.js_files).length,
          "Download coverage listed separately",
        ],
        [
          "params",
          "Parameter mappings",
          params.length,
          "All recorded endpoint mappings",
        ],
        [
          "findings",
          "Scanner findings",
          arr(D.findings).length,
          phaseStatus("vulnerabilities") === "skipped"
            ? "Nuclei skipped"
            : "Requires impact validation",
        ],
        [
          "secrets",
          "Secret candidates",
          arr(D.secrets).length,
          "Masked values; manual review",
        ],
        [
          "unavailable",
          "Unavailable services",
          httpCounts.unavailable,
          "5xx responses · excluded from live",
        ],
      ]) {
        const c = node("div", undefined, "card");
        c.tabIndex = 0;
        c.setAttribute("role", "button");
        c.dataset.metric = id;
        const cardTop = node("div", undefined, "card-top");
        const icon = node(
          "span",
          id === "unavailable" ? "🚧" : icons[id],
          "metric-icon",
        );
        icon.setAttribute("aria-hidden", "true");
        cardTop.append(icon, node("span", "↗", "metric-arrow"));
        c.append(
          cardTop,
          node("div", label, "label"),
          node("div", fmt(count), "number"),
          node("div", note, "note"),
        );
        c.onclick = () =>
          id === "unavailable"
            ? setHTTPView("unavailable")
            : id === "hosts"
              ? setHTTPView("live")
              : show(id);
        c.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            c.click();
          }
        };
        cards.append(c);
      }
      overview.append(cards);
      const insightGrid = node("div", undefined, "grid insight-grid");
      const health = node("div", undefined, "panel health-panel");
      const healthHead = node("div", undefined, "panel-heading");
      healthHead.append(
        node("h2", "💓 HTTP response landscape"),
        pill(fmt(httpRows.length) + " observed"),
      );
      health.append(
        healthHead,
        node(
          "p",
          "Availability at observation time. A response is evidence, not a health check.",
          "muted panel-note",
        ),
      );
      const healthBody = node("div", undefined, "health-body");
      const ring = node("div", undefined, "health-ring");
      let cursor = 0;
      const stops = httpGroups
        .filter(([key]) => httpCounts[key])
        .map(([key, , , color]) => {
          const from = cursor;
          cursor += (httpCounts[key] / Math.max(1, httpRows.length)) * 100;
          return `${color} ${from}% ${cursor}%`;
        });
      ring.style.background = stops.length
        ? `conic-gradient(${stops.join(",")})`
        : "var(--line)";
      ring.setAttribute("role", "img");
      ring.setAttribute(
        "aria-label",
        httpGroups
          .map(([key, , label]) => `${label}: ${httpCounts[key]}`)
          .join(", "),
      );
      const center = node("div", undefined, "ring-center");
      center.append(
        node("strong", fmt(liveRows.length)),
        node("span", "LIVE SEEDS"),
      );
      ring.append(center);
      const legend = node("div", undefined, "health-legend");
      for (const [key, icon, label, color] of httpGroups) {
        const b = node("button", undefined, "legend-row");
        const dot = node("i", undefined, "legend-dot");
        dot.style.background = color;
        b.append(
          dot,
          node("span", icon + " " + label),
          node("strong", fmt(httpCounts[key])),
        );
        b.onclick = () => setHTTPView("all", key);
        legend.append(b);
      }
      healthBody.append(ring, legend);
      health.append(healthBody);
      const review = node("div", undefined, "panel review-panel");
      review.append(
        node("h2", "🎯 Start your review"),
        node(
          "p",
          "Collected leads, ready for a closer look.",
          "muted panel-note",
        ),
      );
      const highFindings = arr(D.findings).filter((f) =>
        ["critical", "high"].includes(String(f.severity).toLowerCase()),
      );
      for (const [id, icon, label, count, note] of [
        [
          "queue",
          "🎯",
          "Prioritized asset review",
          arr(SCAN_DATA.review_queue).filter((a) => a.priority === "review")
            .length,
          "Explainable review order with suggested checks",
        ],
        [
          "findings",
          "🎯",
          "High / critical matches",
          highFindings.length,
          "Scanner matches still need impact validation",
        ],
        [
          "secrets",
          "🔑",
          "Secret candidates",
          arr(D.secrets).length,
          "Masked evidence with local review notes",
        ],
        [
          "unavailable",
          "🚧",
          "Unavailable services",
          httpCounts.unavailable,
          "Retained as evidence; excluded from live seeds",
        ],
        [
          "coverage",
          "🧭",
          "Incomplete phases",
          incomplete.length,
          "Check source budgets and partial coverage",
        ],
      ]) {
        const b = node("button", undefined, "review-row");
        const text = node("div");
        text.append(node("strong", label), node("small", note));
        b.append(
          node("span", icon, "review-icon"),
          text,
          node("b", fmt(count)),
          node("span", "→"),
        );
        b.onclick = () =>
          id === "unavailable" ? setHTTPView("unavailable") : show(id);
        review.append(b);
      }
      insightGrid.append(health, review);
      overview.append(insightGrid);
      const grid = node("div", undefined, "grid"),
        phases = node("div", undefined, "panel"),
        sources = node("div", undefined, "panel");
      phases.append(node("h2", "🧭 Execution & coverage"));
      if (!phaseRows.length)
        phases.append(
          node(
            "p",
            "No phase manifest recorded. Coverage cannot be inferred from result counts.",
            "muted",
          ),
        );
      phaseRows.forEach((p) => {
        const row = node("div", undefined, "row");
        const label = node("div", undefined, "phase-label");
        label.append(node("span", p.name));
        if (p.reason) label.append(node("small", p.reason, "muted"));
        row.append(label, pill(p.status));
        phases.append(row);
      });
      sources.append(node("h2", "📊 Discovery sources"));
      const sourceCounts = new Map();
      arr(D.subdomain_sources).forEach((s) =>
        sourceCounts.set(
          s.source || "unknown",
          (sourceCounts.get(s.source || "unknown") || 0) + 1,
        ),
      );
      const maxSource = Math.max(1, ...sourceCounts.values());
      [...sourceCounts]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .forEach(([name, count]) => {
          const row = node("div", undefined, "row");
          row.append(node("span", name), node("strong", fmt(count)));
          const bar = node("div", undefined, "bar"),
            i = node("i");
          i.style.width = (count / maxSource) * 100 + "%";
          bar.append(i);
          sources.append(row, bar);
        });
      sources.append(
        node(
          "p",
          "First discovery source attribution; counts are not independent confirmations.",
          "muted",
        ),
      );
      grid.append(phases, sources);
      overview.append(grid);
      const cov = heading(
        "coverage",
        "Coverage history & limitations",
        "Historical coverage notes are retained, including resolved failures. Current phase/source states and retry history show what still needs attention.",
      );
      arr(D.coverage).forEach((note) =>
        cov.append(node("div", note, "coverage-item")),
      );
      if (!arr(D.coverage).length)
        cov.append(
          node(
            "p",
            "No coverage notes were recorded. This does not guarantee exhaustive testing.",
            "muted",
          ),
        );
      if (SCAN_DATA.scope) {
        cov.append(
          node("h2", "Configured scope"),
          node("pre", JSON.stringify(SCAN_DATA.scope, null, 2), "panel mono"),
        );
      }

      show(location.hash.slice(1) || "overview");
    </script>
  </body>
</html>
